[project]
name = "tiny-salary"
version = "0.1.0"
description = "A small, instant salary and currency calculator."
requires-python = ">=3.12"
dependencies = ["robyn>=0.81,<1", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["ruff>=0.15", "ty>=0.0.18", "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "polyfactory>=2,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
