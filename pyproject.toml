[project]
name = "tiny-salary"
version = "0.1.0"
description = "A small, instant salary and currency calculator."
requires-python = ">=3.12"
dependencies = ["robyn>=0.81,<1"]

[dependency-groups]
dev = ["ruff>=0.15", "ty>=0.0.18"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
